<style>
:root{--bg:#f2f6fa;--card:#fff;--tx:#14212e;--mu:#62748a;--pr:#0a6aa5;--prt:#fff;--bd:#dce4ee;--ok:#2f855a;--wa:#c2410c;--ac:#f5a30a;--sh:0 1px 2px rgba(20,33,46,.05),0 6px 18px rgba(20,33,46,.07)}
:root[data-theme="dark"]{--bg:#0b1520;--card:#132131;--tx:#e8eef6;--mu:#93a4ba;--pr:#4cb3ee;--prt:#04202f;--bd:#223649;--ok:#7bd89f;--wa:#fb923c;--ac:#fbbf24;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}
nav{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
nav b{font-size:1.15rem;margin-right:auto}
.tab{background:transparent;color:var(--tx);border:0;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
.tab.on{background:var(--pr);color:var(--prt)}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--bd);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--mu)}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0}h2{font-size:1.15rem;margin:0 0 6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.mu{color:var(--mu);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.room{cursor:pointer}.room:hover{border-color:var(--pr)}
button,.btn{font:inherit;background:var(--pr);color:var(--prt);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--pr);border:1px solid var(--bd)}
button.danger{background:transparent;color:var(--wa);border:1px solid var(--bd)}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:.85rem;color:var(--mu)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:4px 12px;font-size:.9rem}
.chip.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.tag{display:inline-block;font-size:.75rem;border-radius:6px;padding:1px 8px;margin-right:6px;border:1px solid var(--bd)}
.tag.a{color:var(--wa)}.tag.m{color:var(--ok)}
.post p{white-space:pre-wrap;margin:8px 0}
.rt{margin:8px 0}.rt p{white-space:pre-wrap;margin:6px 0}.rt ul,.rt ol{margin:6px 0;padding-left:1.4em}.rt li{margin:2px 0}
.fbar{display:flex;gap:6px;margin:4px 0 0}.fbar button{width:auto;min-width:36px;padding:4px 10px;margin:0;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:8px;font-size:.9rem}.fbar button:hover{border-color:var(--pr)}.fbar+textarea{margin-top:6px}.fhint{font-size:.78rem;opacity:.7;margin:-6px 0 10px}
.files{display:flex;flex-wrap:wrap;gap:8px}
.files img{max-width:100%;max-height:300px;border-radius:8px;border:1px solid var(--bd)}
.files a{border:1px solid var(--bd);border-radius:8px;padding:6px 10px;color:var(--pr);text-decoration:none;font-size:.9rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:420px;width:100%;margin:0}
.err{color:var(--wa);font-size:.9rem;min-height:1.2em}
.big{width:96px;height:96px;font-size:2rem}
.prof{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:.75rem;color:var(--mu)}
.cd{min-height:60px;border:1px solid var(--bd);border-radius:8px;padding:4px;font-size:.85rem;cursor:pointer;background:var(--card);overflow:hidden}
.cd.out{opacity:.3;cursor:default}.cd.today{border-color:var(--pr);border-width:2px}
.cd.sel{background:var(--pr);color:var(--prt)}
.dot{display:block;font-size:.65rem;border-radius:4px;background:var(--pr);color:#fff;margin-top:2px;padding:0 3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cd.sel .dot{background:var(--prt);color:var(--pr)}
.tag.late{color:#fff;background:#e03131;border-color:#e03131}
.dot.late{background:#e03131;color:#fff}
.cd.sel .dot.late{background:#e03131;color:#fff}
.card.pinned{border-left:4px solid var(--pr)}
.tag.pin{color:var(--pr);border-color:var(--pr)}
.vid{position:relative;width:100%;max-width:560px;aspect-ratio:16/9}.vid iframe{width:100%;height:100%;border:0;border-radius:8px}
.links{display:flex;flex-direction:column;gap:8px;margin-top:8px;align-items:flex-start}
.links a,.pl a{border:1px solid var(--bd);border-radius:8px;padding:6px 10px;color:var(--pr);text-decoration:none;font-size:.9rem;word-break:break-all}
.pl{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}.pl div{display:flex;gap:8px;align-items:center}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.card.done{border-color:var(--ok)}
.dot.dn,.cd.sel .dot.dn{background:var(--ok);color:#fff;text-decoration:line-through}

/* ---- Otte design ---- */
body{background:var(--bg) radial-gradient(900px 300px at 85% -80px,color-mix(in srgb,var(--pr) 14%,transparent),transparent) no-repeat;min-height:100vh}
h1,h2,.brand{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;letter-spacing:-.01em}
h1{font-size:1.9rem}
header{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
nav{padding:12px 16px;gap:6px}
nav b.brand{display:flex;align-items:center;gap:8px;font-size:1.45rem;font-weight:700;color:var(--tx);margin-right:auto}
.logo{width:auto;height:46px;object-fit:contain;display:block}
.tab{border-radius:99px;padding:7px 16px;color:var(--mu);font-weight:600;transition:background .15s,color .15s}
.tab:hover{background:color-mix(in srgb,var(--pr) 10%,transparent);color:var(--tx)}
.tab.on{background:var(--pr);color:var(--prt)}
.card{border-radius:18px;box-shadow:var(--sh);padding:18px}
.room{transition:transform .15s,border-color .15s,box-shadow .15s}
.room:hover{transform:translateY(-3px);border-color:var(--pr)}
button,.btn{border-radius:99px;padding:9px 18px;font-weight:600;transition:filter .15s,transform .05s}
button:hover,.btn:hover{filter:brightness(1.08)}button:active{transform:scale(.97)}
button.ghost,button.danger{border-radius:99px}
button.ghost:hover{background:color-mix(in srgb,var(--pr) 8%,transparent)}
button.danger:hover{background:color-mix(in srgb,var(--wa) 10%,transparent)}
input,select,textarea{border-radius:12px;background:color-mix(in srgb,var(--bg) 60%,var(--card));transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 22%,transparent)}
input[type=file]{padding:8px;border:1.5px dashed var(--bd);border-radius:14px;color:var(--mu);font-size:.9rem;cursor:pointer;background:color-mix(in srgb,var(--pr) 4%,var(--card))}
input[type=file]:hover{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 8%,var(--card))}
input[type=file]::file-selector-button{font:inherit;font-weight:600;background:var(--pr);color:var(--prt);border:0;border-radius:99px;padding:8px 18px;margin-right:12px;cursor:pointer;transition:filter .15s}
input[type=file]::file-selector-button:hover{filter:brightness(1.1)}
.chip{padding:5px 14px;cursor:pointer}
.tag{border-radius:99px;padding:2px 10px;font-weight:600}
.card.pinned{border-left:0;border-top:4px solid var(--pr)}
.cd{border-radius:12px}
.modal{background:rgba(15,23,25,.55);backdrop-filter:blur(3px)}
.modal .card{box-shadow:0 20px 50px rgba(0,0,0,.3)}
.av{box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--bd)}
.help{width:34px;height:34px;padding:0;border:1.5px solid var(--bd);font-weight:700;color:var(--pr)}
.help:hover{border-color:var(--pr)}
.about h3{font:700 1rem Georgia,serif;margin:14px 0 4px}.about ol,.about ul{margin:4px 0;padding-left:20px}.about li{margin:3px 0}
.about .hd{display:flex;align-items:center;gap:12px}.about .hd img{width:auto;height:84px;flex:none}
.note{margin:10px 0 4px;border:1px dashed var(--bd);border-radius:12px;padding:8px 12px;background:color-mix(in srgb,var(--ac) 7%,var(--card))}
.note summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
.note summary::-webkit-details-marker{display:none}
.note summary::after{content:'▾';margin-left:auto;color:var(--mu);transition:transform .15s}
.note[open] summary::after{transform:rotate(180deg)}
.note textarea{margin:8px 0 4px;resize:vertical;min-height:90px}
.note .nh{display:flex;justify-content:space-between;gap:8px;font-size:.8rem}
.dotn{width:8px;height:8px;border-radius:50%;background:var(--ac);display:inline-block}.dotn[hidden]{display:none}
.bubble{position:relative;display:inline-block;margin:2px 0 14px;padding:5px 14px;border:1px solid var(--bd);border-radius:99px;background:var(--card);box-shadow:var(--sh);font-weight:600;font-size:.9rem}
.bubble::before{content:'';position:absolute;top:-6px;left:50%;width:10px;height:10px;background:var(--card);border-left:1px solid var(--bd);border-top:1px solid var(--bd);transform:translateX(-50%) rotate(45deg)}
.tour .tw{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
.tour .th{display:flex;justify-content:space-between;align-items:center;color:#e6eef8;font-size:.9rem;font-weight:600}
.tour .th button{padding:4px 14px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}
.fc{perspective:1200px;height:clamp(330px,58vh,430px);cursor:pointer;outline:0}
.fi{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;border-radius:22px}
.fc:focus-visible .fi{box-shadow:0 0 0 3px var(--pr)}
.fc.flip .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:22px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.ff img{height:150px;width:auto;max-width:100%;object-fit:contain}
.ff h2{margin:0;font-size:1.45rem}
.ff.bk{transform:rotateY(180deg);justify-content:flex-start;align-items:stretch;text-align:left;overflow:auto;background:color-mix(in srgb,var(--ac) 8%,var(--card))}
.bk h3{font:700 1.1rem Georgia,serif;margin:0 0 4px;color:var(--pr)}
.bk p,.bk ul,.bk ol{margin:6px 0;font-size:.95rem;line-height:1.45}.bk ul,.bk ol{padding-left:20px}.bk li{margin:3px 0}
.dots{display:flex;justify-content:center;align-items:center;gap:6px}.dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.3);transition:width .2s}.dots i.dn{background:rgba(255,255,255,.65)}.dots i.on{width:22px;background:var(--ac)}
.tn{display:flex;gap:10px}.tn button{flex:1}.tn .pv{background:var(--card);border:1px solid var(--bd)}.tn .pv:disabled{opacity:.55;cursor:default}
@media(prefers-reduced-motion:reduce){.fi{transition:none}}
#gq{margin:0 0 12px}.gres h2{font-size:1.05rem;margin:8px 0 2px}
mark{background:color-mix(in srgb,var(--ac) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.flash{animation:flash 2s ease-out}
@keyframes flash{0%,50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 75%,transparent)}100%{box-shadow:var(--sh)}}
.fbk{margin:10px 0;padding:10px 12px;border-left:4px solid var(--pr);border-radius:10px;background:color-mix(in srgb,var(--pr) 8%,var(--card))}
.fb{margin-top:8px;padding:10px;border:1px dashed var(--bd);border-radius:12px}.fb .row{align-items:center}.fb .g{max-width:190px}.fb textarea{margin-top:6px}
.alertc{border:1.5px solid #e8590c;background:color-mix(in srgb,#e8590c 9%,var(--card));margin-bottom:14px}.alertc h2{margin:0 0 6px;font-size:1.05rem}
.al-l{margin:6px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.al-l .k{min-width:92px}
.al-i{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:3px 12px;font-size:.88rem;font-weight:500}
.dot.ev,.cd.sel .dot.ev{background:#7048e8;color:#fff}.dl-i.ev{border-left:4px solid #7048e8}.ag-top{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.dl{margin-bottom:16px}
.dl-g{margin:12px 0 4px;font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.dl-i{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--bd);border-radius:12px;margin:6px 0;cursor:pointer;transition:border-color .15s,transform .15s}
.dl-i:hover{border-color:var(--pr);transform:translateX(2px)}
.dl-i .t{flex:1;min-width:0}.dl-i .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-i .d{font-size:.8rem;font-weight:600;white-space:nowrap;border-radius:99px;padding:3px 12px;background:color-mix(in srgb,var(--pr) 12%,transparent);color:var(--pr)}
.dl-i.late .d{background:color-mix(in srgb,var(--wa) 14%,transparent);color:var(--wa)}
.dl-i.today .d{background:var(--ac);color:#3a2600}
.sr{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}.sr .files{margin-top:4px}
.out #t-rooms,.out #t-ag,.out #t-acc,.out #hav{display:none}
.auth{max-width:420px;margin:24px auto}.auth h1{font-size:1.5rem;text-align:center}.auth .mu{text-align:center}.auth a{color:var(--pr);font-weight:600}
.authlogo{display:block;width:auto;height:120px;margin:0 auto 6px;object-fit:contain}
.hero{display:block;width:auto;height:132px;margin:0 auto 6px;object-fit:contain;animation:bob 3.2s ease-in-out infinite}
.pk{all:unset;display:block;margin:0 auto 6px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:18px}
.pk:focus-visible{outline:2px solid var(--pr);outline-offset:4px}
.pkb{position:relative;display:block;height:160px;width:200px;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
.pa{position:absolute;left:50%;bottom:0;height:100%;width:auto;max-width:none;transform:translateX(-50%);opacity:0;transition:opacity .22s ease;pointer-events:none;user-select:none}
.pa.on{opacity:1}
.pk.hop{animation:hop .5s cubic-bezier(.3,.7,.4,1)}
.pk.sl .pkb{animation-duration:5.5s}
.pkb .z{position:absolute;top:10%;right:8%;font-style:normal;font-weight:800;color:var(--mu);opacity:0;pointer-events:none}
.pk.sl .z{animation:zz 2.6s ease-in infinite}.pk.sl .z:nth-of-type(2){animation-delay:.9s}.pk.sl .z:nth-of-type(3){animation-delay:1.8s}
.bubble{transition:opacity .16s;max-width:min(92vw,430px)}
.authlogo{animation:bob 3.4s ease-in-out infinite}
.ptoast{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;align-items:center;gap:10px;max-width:min(330px,calc(100vw - 28px));padding:8px 16px 8px 10px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);font-weight:600;font-size:.92rem;animation:ptin .4s cubic-bezier(.2,1.4,.4,1);transition:opacity .3s,transform .3s}
.ptoast img{height:58px;width:auto;flex:none;animation:hop .55s .15s cubic-bezier(.3,.7,.4,1)}
.ptoast.out{opacity:0;transform:translateY(14px)}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.03)}}
@keyframes hop{0%{transform:translateY(0)}28%{transform:translateY(-24px) scaleY(1.05)}55%{transform:translateY(0) scale(1.06,.92)}75%{transform:translateY(-7px)}100%{transform:translateY(0)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.9}100%{opacity:0;transform:translate(16px,-36px) scale(1.25)}}
@keyframes ptin{from{opacity:0;transform:translateY(26px) scale(.9)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.authlogo,.pk,.pkb,.pk .z,.ptoast,.ptoast img{animation:none!important}}
.sleepy{display:flex;align-items:center;gap:14px;margin-top:6px}.sleepy img{height:72px;width:auto;flex:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.hero{animation:none}}
@media(max-width:520px){h1{font-size:1.5rem}nav b.brand{font-size:1.25rem}}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const PRESETS={'Bimestre':'1º Bimestre, 2º Bimestre, 3º Bimestre, 4º Bimestre','Trimestre':'1º Trimestre, 2º Trimestre, 3º Trimestre','Semestre':'1º Semestre, 2º Semestre','Unidade curricular':'Unidade 1, Unidade 2, Unidade 3','Personalizado':'Módulo A, Módulo B'};
const blankS=()=>({profile:{name:'',role:'professor',school:'',email:'',subject:'',bio:'',photo:'',theme:'light'},rooms:[],unlocked:[],done:{},notes:{}});
let S=blankS(),accounts=[],acct=null;
let curList=[],pl=[],cm=(()=>{const d=new Date();d.setDate(1);return d})(),cdSel=null,rv='p',tab='rooms',room=null,filt={p:'Todos',k:'todos',q:''};

/* ---------- armazenamento (IndexedDB, com fallback em memória) ---------- */
let idb=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('salavirtual',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function save(){if(!idb||!acct)return;try{idb.transaction('kv','readwrite').objectStore('kv').put(S,acct.guest?'state':'state:'+acct.id)}catch(e){}}
function kvGet(k){return new Promise(res=>{try{const q=idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res()}catch(e){res()}})}
function kvSet(k,v){return new Promise(res=>{try{const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
function kvDel(k){return new Promise(res=>{try{const t=idb.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
async function loadState(){S=blankS();const d=await kvGet(acct.guest?'state':'state:'+acct.id);if(d)S={...S,...d,profile:{...S.profile,...d.profile}}}
function startSession(){unlockedNow.clear();S.profile.id=S.profile.id||rid();S.rooms.forEach(r=>{if(!r.code)r.code=r.id.slice(0,6).toUpperCase()});document.body.classList.remove('out');tab='rooms';room=null;save();render()}
function authScreen(mode){
  document.body.classList.add('out');document.documentElement.dataset.theme='light';room=null;tab='rooms';const c=mode==='new',lg=MASCOT.wave;
  $('#app').innerHTML=`<div class="card auth"><img class="authlogo" src="${lg}" alt=""><h1>${c?'Criar conta':'Entrar no Otte'}</h1><p class="mu">${c?'Crie uma conta para guardar suas salas, postagens e progresso.':'Entre para acessar suas salas.'}</p>
  ${c?'<label>Nome completo</label><input id="an" autocomplete="name"><label>Eu sou</label><select id="ar"><option value="professor">Professor(a)</option><option value="aluno">Aluno(a)</option></select>':''}
  <label>E-mail ou usuário</label><input id="au" autocomplete="username" autocapitalize="none">
  <label>Senha${c?' (mínimo de 6 caracteres)':''}</label><input id="aw" type="password" autocomplete="${c?'new-password':'current-password'}">
  ${c?'<label>Repita a senha</label><input id="a2" type="password" autocomplete="new-password">':''}
  <div class="err" id="ae"></div><button id="ag" style="width:100%">${c?'Criar conta':'Entrar'}</button>
  <button class="ghost" id="sk" style="width:100%;margin-top:8px">${acct&&acct.guest?'Voltar sem conta':'Pular por enquanto'}</button>
  <p class="mu" style="margin:6px 0 0">Você pode criar a conta depois, em Minha conta.</p>
  <p class="mu" style="text-align:center;margin:12px 0 0">${c?'Já tem conta?':'Ainda não tem conta?'} <a href="#" id="as">${c?'Entrar':'Criar conta'}</a></p>
  ${c?'<p class="mu" style="margin-bottom:0">Sua conta fica salva neste aparelho e neste navegador; ela não é online. Não há como recuperar a senha, então guarde-a bem.</p>':''}</div>`;
  $('#as').onclick=e=>{e.preventDefault();authScreen(c?'login':'new')};
  const go=async()=>{const er=$('#ae'),u=$('#au').value.trim().toLowerCase(),w=$('#aw').value;er.textContent='';
    if(!u)return er.textContent='Informe seu e-mail ou usuário.';
    if(c){const nm=$('#an').value.trim();if(!nm)return er.textContent='Informe seu nome.';if(w.length<6)return er.textContent='A senha precisa ter pelo menos 6 caracteres.';if(w!==$('#a2').value)return er.textContent='As senhas não são iguais.';if(accounts.some(a=>a.user===u))return er.textContent='Já existe uma conta com esse e-mail ou usuário.';
      const wasGuest=acct&&acct.guest,first=!accounts.length,salt=rid(),a={id:rid(),user:u,salt,hash:await hash(w,salt)};accounts.push(a);await kvSet('accounts',accounts);acct=a;S=blankS();
      const old=(first||wasGuest)?await kvGet('state'):null;if(old){S={...S,...old,profile:{...S.profile,...old.profile}};await kvDel('state')}
      S.profile.name=S.profile.name||nm;if(!old){S.profile.role=$('#ar').value;if(u.includes('@'))S.profile.email=u}
      await kvSet('session',a.id);startSession()}
    else{const a=accounts.find(x=>x.user===u);if(!a||await hash(w,a.salt)!==a.hash)return er.textContent='E-mail/usuário ou senha incorretos.';acct=a;await kvSet('session',a.id);await loadState();startSession()}};
  $('#sk').onclick=async()=>{acct={guest:true,id:'guest',user:'visitante'};await kvSet('session','guest');await loadState();startSession()};
  $('#ag').onclick=go;document.querySelectorAll('.auth input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()})}
async function hash(pw,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(salt+pw)))}}
const readURL=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
function resize(file,max=256){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.min(im.width,im.height)),w=im.width*k,h=im.height*k,s=Math.min(w,h),c=document.createElement('canvas');c.width=c.height=Math.min(max,s);c.getContext('2d').drawImage(im,(w-s)/-2/k*k,(h-s)/-2,w,h);ok(c.toDataURL('image/jpeg',.85))};im.onerror=no;im.src=URL.createObjectURL(file)})}
function avatarOf(p,cls=''){return /^data:image\//.test(p.photo||'')?`<img class="av ${cls}" src="${p.photo}" alt="Foto">`:`<span class="av ${cls}">${esc((p.name||'?').trim()[0]||'?').toUpperCase()}</span>`}
const avatar=cls=>avatarOf(S.profile,cls);
function applyTheme(){document.documentElement.dataset.theme=S.profile.theme;$('#hav').innerHTML=(S.profile.name||S.profile.photo)?avatar():'';$('#t-rooms').classList.toggle('on',tab==='rooms');$('#t-acc').classList.toggle('on',tab==='acc');$('#t-ag').classList.toggle('on',tab==='ag')}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card">${html}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
const isT=r=>r&&r.own;
const isDone=(rid,pid)=>!!(S.done&&S.done[rid]&&S.done[rid][pid]);
const noteOf=(rid,pid)=>((S.notes||{})[rid]||{})[pid]||'';
let noteOpen=new Set(),noteTimer;
const noteHtml=(r,p)=>{const v=noteOf(r.id,p.id);return `<details class="note" data-np="${p.id}" ${noteOpen.has(p.id)?'open':''}><summary>📝 Minhas anotações <span class="dotn" ${v?'':'hidden'} title="Você tem anotações aqui"></span></summary><textarea data-nt="${p.id}" rows="4" maxlength="5000" placeholder="Escreva aqui o que quiser lembrar sobre esta postagem…">\n${esc(v)}</textarea><div class="mu nh"><span>🔒 Só você vê estas anotações</span><span class="ns"></span></div></details>`};
function wireNotes(r){
  document.querySelectorAll('details.note').forEach(d=>d.addEventListener('toggle',()=>{d.open?noteOpen.add(d.dataset.np):noteOpen.delete(d.dataset.np)}));
  document.querySelectorAll('textarea[data-nt]').forEach(a=>{const pid=a.dataset.nt,box=a.closest('.note'),st=box.querySelector('.ns'),dot=box.querySelector('.dotn');
    const put=()=>{S.notes=S.notes||{};const n=S.notes[r.id]=S.notes[r.id]||{};if(a.value.trim())n[pid]=a.value;else delete n[pid];dot.hidden=!a.value.trim()};
    a.oninput=()=>{put();st.textContent='Salvando…';clearTimeout(noteTimer);noteTimer=setTimeout(()=>{save();st.textContent='Salvo ✓'},500)};

function agendaItems(){const it=[];

  (S.events||[]).forEach(e=>it.push({k:e.date,title:e.title,sub:(EVK[e.kind]||'📌 Outro')+(e.time?' · '+e.time:''),e}));
  return it.sort((a,b)=>a.k.localeCompare(b.k)||(a.e&&b.e?(a.e.time||'').localeCompare(b.e.time||''):0))}
function agenda(){
  const y=agM.getFullYear(),mo=agM.getMonth(),n=new Date(y,mo+1,0).getDate(),first=agM.getDay(),tk=todayKey(),all=agendaItems(),by={};all.forEach(x=>(by[x.k]=by[x.k]||[]).push(x));
  let cells=['D','S','T','Q','Q','S','S'].map(w=>`<div class="wd">${w}</div>`).join('')+'<div class="cd out"></div>'.repeat(first);
  for(let d=1;d<=n;d++){const k=dkey(y,mo,d),L=by[k]||[];cells+=`<div class="cd ${k===tk?'today':''} ${k===agSel?'sel':''}" data-k="${k}"><b>${d}</b>${L.slice(0,2).map(x=>`<span class="dot ${x.e?'ev':x.done?'dn':x.k<tk?'late':''}">${esc(x.title)}</span>`).join('')}${L.length>2?`<span class="dot">+${L.length-2}</span>`:''}</div>`}
  const list=agSel?(by[agSel]||[]):all.filter(x=>x.k>=tk).slice(0,15),title=agSel?'Compromissos de '+brd(agSel):'Próximos compromissos';
  const card=x=>x.e?`<div class="card" data-ev="${esc(x.e.id)}" style="cursor:pointer"><span class="tag" style="background:#7048e8;color:#fff;border-color:#7048e8">${esc(EVK[x.e.kind]||'📌 Outro')}</span><span class="tag">${brd(x.k)}${x.e.time?' · '+esc(x.e.time):''}</span><h2 style="margin-top:8px">${esc(x.e.title)}</h2>${x.e.note?`<div class="mu">${esc(x.e.note)}</div>`:''}</div>`
   :`<div class="card" data-dl="${esc(x.r.id)}" style="cursor:pointer"><span class="tag a">✏️ Atividade</span>${x.done?'<span class="tag m">✅ Concluída</span>':x.k<tk?`<span class="tag late">Venceu · ${brd(x.k)}</span>`:`<span class="tag">${brd(x.k)}${x.k===tk?' · hoje':''}</span>`}<h2 style="margin-top:8px">${esc(x.title)}</h2><div class="mu">${esc(x.sub)}</div></div>`;
  $('#app').innerHTML=`<h1>📅 Agenda</h1><p class="mu">Os prazos das suas salas e os seus eventos pessoais (provas, trabalhos, lembretes) em um só lugar.</p>
  <div class="ag-top"><button id="ne">+ Novo evento</button><button class="ghost" id="ics">📤 Exportar para o Google Agenda</button></div>
  <div class="card"><div class="top" style="margin:0 0 10px"><button class="ghost" id="apm">‹</button><h2 style="margin:0;text-transform:capitalize">${agM.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><button class="ghost" id="anm">›</button></div><div class="cal">${cells}</div><div class="mu" style="margin-top:8px">Toque em um dia para ver os compromissos dele.</div></div>
  <div class="top" style="margin:16px 0 8px"><h2 style="margin:0">${title}</h2>${agSel?'<button class="ghost" id="acl">Ver próximos</button>':''}</div>
  ${list.length?list.map(card).join(''):`<div class="card">${agSel?'Nada marcado neste dia.':'✅ Nada marcado para os próximos dias.'}</div>`}`;
  $('#apm').onclick=()=>{agM=new Date(y,mo-1,1);agSel=null;agenda()};$('#anm').onclick=()=>{agM=new Date(y,mo+1,1);agSel=null;agenda()};
  document.querySelectorAll('.cd[data-k]').forEach(e=>e.onclick=()=>{agSel=agSel===e.dataset.k?null:e.dataset.k;agenda()});
  if(agSel)$('#acl').onclick=()=>{agSel=null;agenda()};
  $('#ne').onclick=()=>evModal(null,agSel||'');$('#ics').onclick=exportIcs;
  document.querySelectorAll('[data-ev]').forEach(e=>e.onclick=()=>evModal((S.events||[]).find(x=>x.id===e.dataset.ev)));
  document.querySelectorAll('[data-dl]').forEach(e=>e.onclick=()=>goRoom(e.dataset.dl));
}
const icsEsc=t=>String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsFold(l){const enc=new TextEncoder();if(enc.encode(l).length<=75)return l;let out='',cur='',len=0,first=true;for(const ch of l){const b=enc.encode(ch).length,lim=first?75:74;if(len+b>lim){out+=(first?'':'\r\n ')+cur;first=false;cur='';len=0}cur+=ch;len+=b}return out+'\r\n '+cur}
function buildIcs(){
  const tk=todayKey(),stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),ymd=k=>k.replace(/-/g,''),nxt=k=>{const[y,m,d]=k.split('-').map(Number),n=new Date(y,m-1,d+1);return dkey(n.getFullYear(),n.getMonth(),n.getDate()).replace(/-/g,'')};
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Otte//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Otte'];let n=0;
  const add=(uid,title,k,time,desc,days)=>{n++;L.push('BEGIN:VEVENT','UID:'+uid+'@otte','DTSTAMP:'+stamp,'SUMMARY:'+icsEsc(title));
    if(time){const[h,mi]=time.split(':').map(Number),eh=h>=23?'2359':pad(h+1)+pad(mi);L.push('DTSTART:'+ymd(k)+'T'+pad(h)+pad(mi)+'00','DTEND:'+ymd(k)+'T'+eh+'00')}
    else L.push('DTSTART;VALUE=DATE:'+ymd(k),'DTEND;VALUE=DATE:'+nxt(k));
    if(desc)L.push('DESCRIPTION:'+icsEsc(desc));
    const trig=time?(days?'-P'+days+'D':'-PT30M'):(()=>{const h=days*24-9;return h>=0?'-PT'+h+'H':'PT'+(-h)+'H'})();
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:'+trig,'END:VALARM','END:VEVENT')};
  S.rooms.forEach(r=>(r.posts||[]).forEach(p=>{if(p.kind==='atividade'&&p.due&&p.due>=tk&&!isDone(r.id,p.id))add('ac-'+r.id+'-'+p.id,'✏️ '+p.title,p.due,'','Atividade da sala '+r.name+' ('+p.period+')',1)}));
  (S.events||[]).forEach(e=>{if(e.date>=tk)add('ev-'+e.id,(EVK[e.kind]||'📌').split(' ')[0]+' '+e.title,e.date,e.time,e.note||'',e.remind==null?1:+e.remind)});
  L.push('END:VCALENDAR');return{text:L.map(icsFold).join('\r\n')+'\r\n',n};
}
function exportIcs(){
  const{text,n}=buildIcs();if(!n)return note('Não há prazos nem eventos futuros para exportar.');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/calendar;charset=utf-8'}));a.download='otte-agenda.ics';a.click();
  note(n+' compromisso(s) exportado(s) para o arquivo otte-agenda.ics.\n\nNo Google Agenda (pelo computador): ⚙ Configurações → Importar e exportar → Importar, e escolha o arquivo. Os lembretes vão junto.')}
const unlockedNow=new Set();let gQ='';
const nzs=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function normMap(str){let n='';const map=[];for(let i=0;i<str.length;i++){const x=nzs(str[i]);for(let j=0;j<x.length;j++){n+=x[j];map.push(i)}}return{n,map}}
function hl(str,words){
  str=String(str||'');const{n,map}=normMap(str),rg=[];
  words.forEach(w=>{let k=0;while((k=n.indexOf(w,k))>-1){rg.push([map[k],map[k+w.length-1]+1]);k+=w.length}});
  rg.sort((a,b)=>a[0]-b[0]);const mg=[];
  rg.forEach(r=>{const l=mg[mg.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else mg.push(r.slice())});
  let o='',q=0;mg.forEach(([a,b])=>{o+=esc(str.slice(q,a))+'<mark>'+esc(str.slice(a,b))+'</mark>';q=b});
  return o+esc(str.slice(q));
}
function snip(str,words,len=150){
  str=String(str||'').replace(/\s+/g,' ').trim();const{n,map}=normMap(str);let at=-1;
  words.forEach(w=>{const k=n.indexOf(w);if(k>-1&&(at<0||map[k]<at))at=map[k]});
  if(at<0)at=0;const a=Math.max(0,at-45),b=Math.min(str.length,a+len);
  return(a>0?'…':'')+hl(str.slice(a,b),words)+(b<str.length?'…':'');
}
function focusPost(id){const el=document.querySelector('.post[data-pid="'+id+'"]');if(!el)return;el.scrollIntoView({block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),2200)}
function globalSearch(){
  const box=$('#gr'),hm=$('#hm');if(!box||!hm)return;
  const words=nzs(gQ).trim().split(/\s+/).filter(Boolean);
  if(!words.length){box.innerHTML='';hm.style.display='';return}
  hm.style.display='none';
  const ok=r=>r.own||unlockedNow.has(r.id),locked=S.rooms.filter(r=>!ok(r)).length,res=[];
  S.rooms.filter(ok).forEach(r=>{
    if(words.every(w=>nzs([r.name,r.subject,r.type].join(' ')).includes(w)))res.push({r,t:0,c:0});
    (r.posts||[]).forEach(p=>{
      const note=noteOf(r.id,p.id),fl=(p.files||[]).map(f=>f.name).join(', '),lk=(p.links||[]).map(l=>(l.title||'')+' '+(l.url||'')).join(' ');
      const all=nzs([p.title,plain(p.body),p.period,p.kind==='atividade'?'atividade':'materia',note,fl,lk].join(' '));
      if(!words.every(w=>all.includes(w)))return;
      const has=x=>{const t=nzs(x);return words.some(w=>t.includes(w))};
      const pb=plain(p.body),src=has(pb)?['',pb]:has(note)?['Anotação',note,1]:has(fl)?['Arquivo',fl]:has(lk)?['Link',lk]:['',pb];
      res.push({r,p,src,t:1,c:p.created||0});
    });
  });
  res.sort((a,b)=>a.t-b.t||b.c-a.c);
  const shown=res.slice(0,60),nr=new Set(res.map(x=>x.r.id)).size;
  box.innerHTML=`<div class="mu" style="margin:0 0 8px">${res.length?res.length+' resultado(s) em '+nr+' sala(s)'+(res.length>60?' · mostrando os 60 primeiros':''):'Nada encontrado.'}</div>`
  +shown.map((x,i)=>x.t===0?`<div class="card room gres" data-i="${i}"><span class="tag">🏫 Sala</span><h2>${hl(x.r.name,words)}</h2><div class="mu">${hl([x.r.subject,x.r.type].filter(Boolean).join(' · '),words)}</div></div>`
   :`<div class="card room gres" data-i="${i}"><span class="tag">🏫 ${esc(x.r.name)}</span><span class="tag ${x.p.kind==='atividade'?'a':'m'}">${x.p.kind==='atividade'?'✏️ Atividade':'📖 Matéria'}</span><span class="tag">${esc(x.p.period)}</span><h2>${hl(x.p.title,words)}</h2>${x.src&&x.src[1]?`<div class="mu">${x.src[0]?'<b>'+x.src[0]+':</b> ':''}${snip(x.src[1],words)}</div>`:''}</div>`).join('')
  +(locked?`<p class="mu">🔒 ${locked} sala(s) onde você ainda não entrou nesta sessão ficaram de fora. Entre nelas com a senha para incluí-las na busca.</p>`:'');
  box.querySelectorAll('.gres').forEach(e=>e.onclick=()=>{const x=shown[+e.dataset.i];if(x.src&&x.src[2])noteOpen.add(x.p.id);enter(x.r);if(x.p)focusPost(x.p.id)});
}

const PSC={"fly": 0.887, "perch": 1.023, "lie": 0.483, "lookup": 0.75, "ponder": 0.715, "back": 0.77, "aha": 0.738, "wink2": 0.675, "dizzy": 0.57, "sideeye": 0.693, "book2": 0.65, "shout": 0.643, "hi2": 0.682, "sleep2": 0.49},PTIPS=['Sabia? Em cada postagem há “Minhas anotações”, só para você 📝','A busca geral encontra qualquer postagem, em todas as salas 🔍','Na Agenda ficam todos os seus prazos 📅','Dá para imprimir ou salvar uma sala em PDF 🖨️','Faça um backup em “Minha conta” de vez em quando 💾','Professores podem fixar postagens importantes no topo 📌'];
let pkStop=null;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function pkStats(){const tk=todayKey(),t1=todayKey(1),lo=todayKey(-GRACE);let late=0,today=0,tmr=0,act=0,dn=0;S.rooms.forEach(r=>(r.posts||[]).forEach(p=>{if(p.kind!=='atividade')return;act++;if(isDone(r.id,p.id)){dn++;return}if(!p.due||p.due<lo)return;if(p.due<tk)late++;else if(p.due===tk)today++;else if(p.due===t1)tmr++}));return{late,today,tmr,act,dn}}
function pkMood(){const h=new Date().getHours(),n=(S.profile.name||'').trim().split(' ')[0],st=pkStats(),g=h<5||h>=19?'Boa noite':h<12?'Bom dia':'Boa tarde';
  if(!S.rooms.length)return['hi2','Oi! Entre em uma sala com o código do professor 🔑'];
  if(st.late)return['ponder',st.late+(st.late>1?' atividades atrasadas':' atividade atrasada')+'. Bora resolver?'];
  if(st.today)return['shout','Tem atividade para entregar hoje! ⏰'];
  if(st.tmr)return['lookup','Fique de olho: tem entrega amanhã 👀'];
  if(h>=23||h<5)return['lie','Já é tarde… não esqueça de descansar 😴'];
  if(st.act&&st.dn===st.act)return['fly','Tudo em dia'+(n?', '+n:'')+'! Parabéns 🎉'];
  return['hi2',g+(n?', '+n:'')+'! Eu sou o Parriot 🦜']}
function parriot(){
  if(pkStop)pkStop();const pk=$('#pk');if(!pk){pkStop=null;return}
  const A=pk.querySelectorAll('.pa'),bub=$('#pbub'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches,EV=['pointermove','pointerdown','keydown','touchstart','scroll'];
  const [hp,ht]=pkMood(),home={p:hp,t:ht};
  let base=home,cur='hi2',fr=0,asleep=false,drowsy=false,busy=false,taps=0,sayId=0,rsT=0,tapT=0,tkT=0,wokeAt=0,last=Date.now();
  /* pose e frase sempre mudam juntas: show() troca os dois no mesmo instante e, se tiver tempo, devolve os dois ao estado base */
  const apply=(n,t)=>{if(n!==cur){const nx=A[1-fr],pv=A[fr];nx.src=MASCOT[n];nx.style.height=Math.round((PSC[n]||.7)*100)+'%';nx.classList.add('on');pv.classList.remove('on');fr=1-fr;cur=n}pk.dataset.pose=n;bub.textContent=t;bub.style.opacity=1};
  const show=(n,t,ms)=>{const id=++sayId;clearTimeout(rsT);bub.style.opacity=0;setTimeout(()=>{if(id===sayId&&pk.isConnected)apply(n,t)},160);if(ms){busy=true;rsT=setTimeout(()=>{busy=false;show(base.p,base.t)},ms)}else busy=false};
  const hop=()=>{if(rm)return;pk.classList.remove('hop');void pk.offsetWidth;pk.classList.add('hop')};
  const drowse=()=>{drowsy=true;base={p:'lie',t:'Estou ficando com sono… 🥱'};show(base.p,base.t)};
  const sleep=()=>{asleep=true;drowsy=false;pk.classList.add('sl');base={p:'sleep2',t:'zzz… 😴'};show(base.p,base.t)};
  const wake=()=>{const was=asleep;asleep=drowsy=false;base=home;wokeAt=Date.now();pk.classList.remove('sl');show('hi2',was?'Voltei! 👋':'Ah, você voltou! 😊',2200);hop()};
  const act=()=>{last=Date.now();if(asleep||drowsy)wake()};
  const tick=()=>{if(!pk.isConnected){stop();return}
    if(!asleep){const idle=Date.now()-last;
      if(idle>60000)sleep();else if(idle>30000){if(!drowsy)drowse()}
      else if(!busy){const r=Math.random();
        if(r<.2)show('lookup','O que será que tem lá em cima? 👀',2400);
        else if(r<.35)show('wink2','Estou de olho em você 😉',2000);
        else if(r<.5)show('sideeye','Hmm… será que você já fez a lição? 🤨',2600);
        else if(r<.62)show('perch','Só descansando no meu poleirinho 🌿',2800);
        else if(r<.72)show('back','Não estou olhando… 🙈',2200);
        else if(r<.88)show('aha',pick(PTIPS),3800)}}
    tkT=setTimeout(tick,3500+Math.random()*3500)};
  function stop(){clearTimeout(rsT);clearTimeout(tapT);clearTimeout(tkT);EV.forEach(e=>window.removeEventListener(e,act,true));pkStop=null}
  pkStop=stop;EV.forEach(e=>window.addEventListener(e,act,{capture:true,passive:true}));
  pk.dataset.pose='hi2';
  setTimeout(()=>{if(pk.isConnected&&!busy&&sayId===0)show(home.p,home.t)},500);
  pk.onclick=()=>{if(Date.now()-wokeAt<500){hop();return}
    taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,1800);hop();
    if(taps>=5){taps=0;show('dizzy','Ai, assim eu fico tonto! 😵‍💫',2800);return}
    const o=pick([['fly','Oba! 🎉'],['wink2','Oi, você! 😉'],['hi2','Olá! 👋'],['aha',pick(PTIPS)]]);show(o[0],o[1],2800)};
  tkT=setTimeout(tick,4000)}
function pkToast(p,msg){const old=document.querySelector('.ptoast');if(old)old.remove();const d=document.createElement('div');d.className='ptoast';d.setAttribute('role','status');const im=document.createElement('img');im.src=MASCOT[p];im.alt='';const sp=document.createElement('span');sp.textContent=msg;d.append(im,sp);document.body.appendChild(d);setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),350)},3000)}
function pkPraise(r,id){const p=r.posts.find(x=>x.id===id);if(!p)return;if(p.kind!=='atividade')return pkToast('book2',pick(['Boa! Mais uma matéria estudada 📖','Estudando em dia! 📖']));
  const A=r.posts.filter(x=>x.kind==='atividade');if(A.every(a=>isDone(r.id,a.id)))pkToast('fly','Todas as atividades da sala em dia! 🎉');else pkToast('fly',pick(['Muito bem! Atividade concluída ✅','Mandou bem! ✅','Mais uma feita! 💪']))}
function home(){
  const mine=S.rooms.filter(r=>r.own);
  $('#app').innerHTML=`<div style="text-align:center;margin:10px 0 24px"><button type="button" class="pk" id="pk" aria-label="Parriot, o mascote do Otte. Toque para brincar"><span class="pkb"><img class="pa on" src="${MASCOT.hi2}" alt="" style="height:${Math.round(PSC.hi2*100)}%"><img class="pa" alt=""><i class="z">z</i><i class="z">z</i><i class="z">Z</i></span></button><div class="bubble" id="pbub" aria-live="polite">Oi! Eu sou o Parriot 🦜</div><h1>Bem-vindo(a)${S.profile.name?', '+esc(S.profile.name.split(' ')[0]):''}!</h1>
  <p class="mu">${S.profile.name?'O que você quer fazer?':'Complete seu perfil em “Minha conta”. O que você quer fazer?'}</p></div>
  ${S.rooms.length?'<input id="gq" type="search" placeholder="🔍 Busca geral: procurar em todas as salas" aria-label="Busca geral"><div id="gr"></div>':''}<div id="hm">${reminderHtml()}
  <div class="grid"><div class="card room" id="go" style="text-align:center;padding:28px"><div style="font-size:2.2rem">🔑</div><h2>Entrar em uma sala</h2><div class="mu">Use o código e a senha da sala</div></div>
  <div class="card room" id="nr" style="text-align:center;padding:28px"><div style="font-size:2.2rem">➕</div><h2>${S.profile.role==='professor'?'Criar uma sala':'Criar um grupo de estudos'}</h2><div class="mu">Para professores e grupos de estudo</div></div></div>
  ${mine.length?`<h2 style="margin-top:24px">Minhas salas e grupos</h2><div class="grid">${mine.map(r=>`<div class="card room mine" data-id="${r.id}"><h2>${esc(r.name)}</h2><div class="mu">${esc(r.subject||'')}</div><div class="mu">${r.group?'👥 Grupo de estudos · ':''}${esc(r.type)} · Código: <b>${esc(r.code)}</b></div></div>`).join('')}</div>`:''}</div>`;
  parriot();
  const gi=$('#gq');if(gi){gi.value=gQ;gi.oninput=()=>{gQ=gi.value;globalSearch()};globalSearch()}
  document.querySelectorAll('.mine').forEach(e=>e.onclick=()=>enter(S.rooms.find(r=>r.id===e.dataset.id)));
  document.querySelectorAll('[data-dl]').forEach(e=>e.onclick=()=>goRoom(e.dataset.dl));
  document.querySelectorAll('[data-ev]').forEach(e=>e.onclick=()=>evModal((S.events||[]).find(x=>x.id===e.dataset.ev)));
  $('#go').onclick=enterModal;
  $('#nr').onclick=newRoom;

function devolutiva(r,mid,name){
  const G=(S.grades||{})[r.id]||{},items=[];
  r.posts.forEach(p=>{const g=(G[p.id]||{})[mid];if(g)items.push({postId:p.id,title:p.title,grade:g.grade,comment:g.comment,at:g.at})});
  if(!items.length)return note('Escreva a nota ou o comentário de pelo menos uma entrega deste aluno antes de baixar a devolutiva.');
  download('devolutiva-'+slug(name)+'.json',JSON.stringify({type:'devolutiva',code:r.code,room:r.name,from:S.profile.name||'Professor',member:{id:mid,name},at:Date.now(),items}));
}
async function receiveFeedback(r,f){
  let d;try{d=JSON.parse(await f.text())}catch(e){return note('Esse arquivo não é uma devolutiva válida.')}
  if(!d||d.type!=='devolutiva'||!Array.isArray(d.items))return note('Esse arquivo não é uma devolutiva do Otte.');
  if(d.code!==r.code)return note('Esta devolutiva é de outra sala.');
  if(!d.member||d.member.id!==S.profile.id)return note('Esta devolutiva é de outro aluno'+(d.member&&d.member.name?' ('+String(d.member.name)+')':'')+'.');
  S.feedback=S.feedback||{};const F=S.feedback[r.id]=S.feedback[r.id]||{};let n=0;
  d.items.forEach(i=>{if(!i||!r.posts.some(p=>p.id===i.postId))return;const at=+i.at||Date.now(),old=F[i.postId];
    if(!old||at>=old.at){F[i.postId]={grade:String(i.grade||'').slice(0,12),comment:String(i.comment||'').slice(0,1000),at};n++}});
  save();roomView(false);note(n?n+' retorno(s) do professor recebido(s)!':'Nenhum retorno válido para esta sala.');
}

function normUrl(u){u=(u||'').trim();if(!u)return null;if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null}catch(e){return null}}
function embedOf(u){try{const x=new URL(u),h=x.hostname.replace(/^www\./,'');let id;
  if(h==='youtu.be')id=x.pathname.replace(/\//g,'');else if(/(^|\.)youtube\.com$/.test(h))id=x.searchParams.get('v')||(x.pathname.match(/^\/(shorts|embed|live)\/([\w-]+)/)||[])[2];
  if(id&&/^[\w-]{6,20}$/.test(id))return{k:'f',src:'https://www.youtube-nocookie.com/embed/'+id};
  if(h==='vimeo.com'){const m=x.pathname.match(/^\/(\d+)/);if(m)return{k:'f',src:'https://player.vimeo.com/video/'+m[1]}}
  if(/\.(mp4|webm|ogg)$/i.test(x.pathname))return{k:'v',src:x.href}}catch(e){}return null}
function linkHtml(l){if(!l||!/^https?:\/\//i.test(l.url||''))return '';const e=embedOf(l.url);let host=l.url;try{host=new URL(l.url).hostname.replace(/^www\./,'')}catch(x){}
  const a=`<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(l.title||host)}</a>`;
  if(e&&e.k==='f')return `<div class="vid"><iframe src="${e.src}" title="${esc(l.title||'Vídeo')}" loading="lazy" allow="fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>${a}`;
  if(e&&e.k==='v')return `<video controls preload="metadata" src="${esc(e.src)}" style="max-width:100%;border-radius:8px"></video>${a}`;
  return a}

function shrink(f,max=1600){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok({name:f.name.replace(/\.\w+$/,'')+'.jpg',type:'image/jpeg',data:c.toDataURL('image/jpeg',.85)})};im.onerror=()=>readURL(f).then(d=>ok({name:f.name,type:f.type,data:d}),no);im.src=URL.createObjectURL(f)})}

}
const TOUR=[{"p": "wave", "q": "O que é o Otte?", "a": "<p>Uma <b>sala de aula virtual</b> simples: aulas, atividades e prazos em um só lugar.</p><p>O professor organiza o conteúdo por período e os alunos acompanham tudo, marcam o que já fizeram e não perdem nenhuma entrega.</p><p>Eu sou o <b>Parriot</b> e vou te mostrar como tudo funciona. Vire os cartões!</p>"}, {"p": "idea", "q": "Preciso criar uma conta?", "a": "<p><b>Não é obrigatório.</b> Toque em <b>Pular por enquanto</b> e use o Otte sem conta; dá para criar depois em <b>Minha conta</b>.</p><p>Com conta (e-mail ou usuário e senha de pelo menos 6 caracteres), suas salas e postagens ficam separadas e protegidas por senha. Várias pessoas podem ter contas no mesmo computador.</p><p>⚠️ Tudo fica salvo <b>só neste aparelho e navegador</b> — não é online — e <b>não há como recuperar a senha</b>. Guarde-a bem!</p><p>💾 Em <b>Minha conta</b> há o <b>backup completo</b>: baixe uma cópia de tudo e restaure em outro aparelho.</p>"}, {"p": "wink", "q": "Sou professor ou aluno?", "a": "<p>Você escolhe em <b>Minha conta</b>, onde também edita nome, escola, bio e foto, e ativa o <b>tema escuro</b>.</p><ul><li><b>Professores</b> criam salas e publicam conteúdo.</li><li><b>Alunos</b> entram em salas, estudam, entregam atividades e podem criar <b>grupos de estudos</b> com os colegas.</li></ul><p>Nas salas que você mesmo criou, você sempre vê a visão de professor.</p>"}, {"p": "hero", "q": "Como o professor cria uma sala?", "a": "<ol><li>Vá em <b>Salas → Criar uma sala</b>.</li><li>Informe a turma, a disciplina, a divisão do ano (bimestre, trimestre, semestre, unidade…) e os períodos.</li><li>Defina uma <b>senha</b> para os alunos.</li></ol><p>A sala ganha um <b>código</b>. Depois você pode alterar a senha ou excluir a sala quando quiser.</p><p>👥 <b>Alunos</b> também criam <b>grupos de estudos</b> pelo mesmo caminho: funcionam como uma sala, para estudar com os colegas.</p>"}, {"p": "hi", "q": "Como o aluno entra na sala?", "a": "<ol><li>O professor toca em <b>⬆ Exportar sala para alunos</b> e envia o arquivo, o código e a senha.</li><li>O aluno toca em <b>Entrar em uma sala</b> e informa o código, a senha e o arquivo.</li></ol><p>O arquivo é pedido só na primeira vez neste aparelho e quando o professor exporta a sala de novo, para o aluno receber as novidades.</p>"}, {"p": "book", "q": "Matérias e atividades", "a": "<p>O professor publica em <b>📄 Postagens</b>:</p><ul><li>📖 <b>Matérias</b> para estudar;</li><li>✏️ <b>Atividades</b>, com data de entrega.</li></ul><p>Cada postagem aceita anexos, imagens, links e vídeos. Dá para <b>fixar 📌</b> as importantes no topo, e todo mundo acha o que precisa filtrando por período e tipo ou usando a busca.</p><p>🔍 Na tela inicial, a <b>busca geral</b> procura um texto em todas as suas salas de uma vez.</p>"}, {"p": "cheer", "q": "Marcar o que já fiz", "a": "<p>O aluno marca cada postagem como <b>estudada</b> ou <b>concluída</b>.</p><p>Uma barra de <b>progresso 📈</b> mostra quantas atividades já foram feitas, e os filtros <b>Pendentes</b> e <b>Concluídas</b> ajudam a organizar o estudo.</p>"}, {"p": "look", "q": "Calendário e prazos", "a": "<p>Em <b>📅 Calendário</b> você vê as entregas de cada dia; toque em um dia para ver os detalhes.</p><p>Entrega vencida aparece em <b>vermelho</b> por 7 dias; depois disso sai do calendário.</p><p>🗓️ Na aba <b>Agenda</b> você junta os prazos de todas as salas com seus <b>eventos pessoais</b> (provas, trabalhos, lembretes) e pode exportar tudo para o <b>Google Agenda</b>. Na tela inicial, o quadro <b>🔔 Lembretes</b> avisa o que vence hoje e amanhã.</p>"}, {"p": "back", "q": "Entregar uma atividade", "a": "<ol><li>O aluno abre a atividade e toca em <b>📤 Entregar atividade</b>, escrevendo o texto e anexando arquivos.</li><li>Baixa o <b>arquivo de entrega</b> e envia ao professor.</li><li>O professor importa o arquivo em <b>📥 Entregas</b> e acompanha quem entregou, inclusive os atrasos.</li><li>O professor dá <b>nota e comentário</b>, baixa a <b>devolutiva</b> do aluno e a envia a ele, que a recebe em <b>📥 Receber devolutiva</b>.</li></ol>"}, {"p": "think", "q": "Minhas anotações", "a": "<p>Cada postagem tem um bloco <b>📝 Minhas anotações</b>: um caderninho só seu.</p><ul><li>Salva sozinho enquanto você escreve.</li><li>Só <b>você</b> vê — não vai na exportação da sala nem nas entregas.</li><li>A busca da sala também procura dentro das suas anotações.</li></ul>"}, {"p": "wave", "q": "Pessoas da sala", "a": "<p>Em <b>👥 Pessoas</b> fica a lista de quem participa da sala; toque em alguém para ver o perfil.</p><p>O aluno envia seu <b>arquivo de perfil</b> ao professor, que o adiciona e exporta a sala de novo para todos verem a lista atualizada.</p>"}, {"p": "sleep", "q": "Imprimir e tema escuro", "a": "<p>🖨️ Dá para <b>imprimir</b> a sala inteira ou uma postagem, ou salvar em PDF.</p><p>🌙 Em <b>Minha conta</b> você ativa o <b>tema escuro</b> para estudar à noite.</p>"}, {"p": "hero", "q": "Pronto para começar?", "a": "<p>É isso! 🎉</p><p>Quando quiser rever estes cartões, toque no <b>?</b> no topo da página e depois em <b>Ver apresentação</b>.</p><p>Bons estudos! 🦜</p>"}];
function openTour(){
  let i=0,flip=false;
  const m=document.createElement('div');m.className='modal tour';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','Apresentação do Otte');
  document.body.appendChild(m);
  const close=()=>m.remove();
  const go=d=>{const n=i+d;if(n>=TOUR.length)return close();if(n<0)return;i=n;flip=false;draw()};
  const draw=()=>{
    const c=TOUR[i],last=i===TOUR.length-1;
    m.innerHTML=`<div class="tw"><div class="th"><span>Cartão ${i+1} de ${TOUR.length}</span><button class="ghost sk">Pular</button></div>
    <div class="fc" tabindex="0" role="button" aria-label="Virar cartão"><div class="fi"><div class="ff fr"><img src="${MASCOT[c.p]}" alt=""><h2>${c.q}</h2><div class="mu">👆 Toque no cartão para ver a resposta</div></div><div class="ff bk"><h3>${c.q}</h3>${c.a}</div></div></div>
    <div class="dots">${TOUR.map((_,k)=>`<i class="${k===i?'on':k<i?'dn':''}"></i>`).join('')}</div>
    <div class="tn"><button class="ghost pv" ${i?'':'disabled'}>‹ Anterior</button><button class="nx">${last?'Começar 🚀':'Próximo ›'}</button></div></div>`;
    const fc=m.querySelector('.fc');
    fc.onclick=()=>{flip=!flip;fc.classList.toggle('flip',flip)};
    m.querySelector('.sk').onclick=close;m.querySelector('.pv').onclick=()=>go(-1);m.querySelector('.nx').onclick=()=>go(1);
    m.querySelector('.nx').focus({preventScroll:true});
  };
  const key=e=>{if(!m.isConnected)return removeEventListener('keydown',key);
    if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
    else if((e.key===' '||e.key==='Enter')&&e.target.classList&&e.target.classList.contains('fc')){e.preventDefault();e.target.click()}};
  addEventListener('keydown',key);
  draw();
}
async function firstVisitHint(){
  if(await kvGet('seenIntro'))return;
  await kvSet('seenIntro',1);
  openTour();
}
(async()=>{await openDB();accounts=(await kvGet('accounts'))||[];const sid=await kvGet('session');acct=sid==='guest'?{guest:true,id:'guest',user:'visitante'}:accounts.find(a=>a.id===sid)||null;if(acct){await loadState();startSession()}else authScreen(accounts.length?'login':'new');firstVisitHint()})();
</script>
